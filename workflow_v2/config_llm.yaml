project:
  target_award: 夜景賞
  theme: 北九州の昼の活動から荘厳な夜景へ移り変わる魅力を、国内外の旅行者へ伝える観光プロモーション動画
  target_duration_seconds: 30

autonomy_preset: manual

review_policies:
  executive_producer: always
  creative_director: always
  writer_storyboard: always
  asset_curator: always
  director: always
  support_video_creator: always
  image_video_production: never
  cut_visual_qa: always
  visual_qa: always
  post_production: always
  review_board: always
  final_submission: always
  provenance: on_exception

review:
  confidence_threshold: 0.75
  max_retries_per_phase: 2

storyboard:
  max_narration_characters_per_second: 8
  duration_large_adjustment_warning_seconds: 2.0
  narration_language: ja
  auto_normalize_narration: true
  final_default_media_requirement: video_required

assets:
  require_primary_for_every_cut: true
  prefer_local: true
  usage_scope: agewec_submission
  auto_download_missing: false
  alternatives_per_cut: 2

execution_limits:
  max_retries_per_phase: 2
  phase_retry_overrides:
    support_video_creator: 6
    image_video_production: 20
    cut_visual_qa: 20
    visual_qa: 4
    post_production: 2
    review_board: 2
  max_total_phase_executions: 60
  max_runtime_minutes: 60
  on_limit: human_review
  max_generation_attempts_per_cut: 2
  max_total_production_attempts: 20

llm:
  enabled: true
  provider: lmstudio
  strict_mode: true
  timeout_seconds: 120
  max_retries: 2
  cost_guard:
    enabled: true
    limit_usd: 5.0
    ledger_path: work/llm_cost_ledger.json
    pricing_model: gpt-4o-mini
    input_cost_per_million_usd: 0.15
    output_cost_per_million_usd: 0.60

  # prompt: すべてのOpenAI互換サーバーで利用しやすい
  # json_object: response_format={"type":"json_object"}
  # json_schema: Structured Outputs対応モデル用
  structured_output_mode: prompt

  profiles:
    planning:
      temperature: 0.4
      max_tokens: 6000
    writing:
      temperature: 0.7
      max_tokens: 4000
    evaluation:
      temperature: 0.1
      max_tokens: 1800

  role_profiles:
    executive_producer: planning
    creative_director: planning
    writer_storyboard: writing
    asset_curator: evaluation
    asset_curator_rationale: evaluation
    director: planning
    visual_qa: evaluation
    post_production: planning
    review_board: evaluation

production:
  backend: comfy
  max_video_cuts_per_run: 3
  continue_on_cut_error: false
  profile: draft
  profiles:
    draft:
      width: 576
      height: 384
      frames: 49
      steps: 20
      fps: 24
    final:
      width: 768
      height: 512
      frames: 97
      steps: 30
      fps: 24
  model_constraints:
    frame_multiple: 8
    frame_offset: 1
    max_frames: 257

qa:
  duration_tolerance_seconds: 0.25
  representative_frame_count: 3

post_production:
  width: 576
  height: 384
  fps: 24
  duration_tolerance_seconds: 0.25

review_board:
  mode: human_only
  skip_reason: submission deadline priority
  pass_threshold: 3.8
  minimum_criterion_score: 3.0
  require_no_blocking_issues: true

final_submission:
  require_human: true

comfy:
  base_url: http://127.0.0.1:8188
  workflow_api_json: workflows/ltx_i2v_api.json
  poll_interval_seconds: 2
  timeout_seconds: 1800
  inputs:
    image: {node_id: "", input: image}
    positive_prompt: {node_id: "", input: text}
    negative_prompt: {node_id: "", input: text}
    width: {node_id: "", input: width}
    height: {node_id: "", input: height}
    frames: {node_id: "", input: length}
    steps: {node_id: "", input: steps}
    fps: {node_id: "", input: fps}
    seed: {node_id: "", input: noise_seed}
    file_prefix: {node_id: "", input: filename_prefix}

paths:
  work_dir: work
  provenance_file: work/provenance.json
  submissions_dir: submissions
