<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AGEWEC パイプライン実行デモ</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.31.0/tabler-icons.min.css" />
<style>
:root{
 --surface-0:#f7f6f2;--surface-1:#f1efe8;--surface-2:#ffffff;
 --text-primary:#1f1f1d;--text-secondary:#5f5e5a;--text-muted:#96958f;
 --text-accent:#185fa5;--border:#e2e0d8;--border-accent:#378add;
 --radius:8px;--font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
 --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
 :root{--surface-0:#1a1a18;--surface-1:#262623;--surface-2:#2f2f2b;
 --text-primary:#f1efe8;--text-secondary:#b4b2a9;--text-muted:#7a7973;
 --text-accent:#85b7eb;--border:#3a3a36;--border-accent:#378add;}
}
*{box-sizing:border-box;}
body{margin:0;background:var(--surface-0);color:var(--text-primary);font-family:var(--font-sans);line-height:1.6;}
.wrap{max-width:760px;margin:0 auto;padding:24px 20px 48px;}
h1{font-size:20px;font-weight:500;margin:0 0 4px;}
.lead{font-size:14px;color:var(--text-secondary);margin:0 0 20px;}
button{font-family:inherit;font-size:14px;padding:7px 12px;border:0.5px solid #b4b2a9;background:transparent;color:var(--text-primary);border-radius:var(--radius);cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .12s;}
button:hover{background:var(--surface-1);}
button:active{transform:scale(0.98);}
pre{margin:0;}
</style>
</head>
<body>
<div class="wrap">
<h1>AGEWEC パイプライン実行デモ</h1>
<p class="lead">Run で企画→出力まで自動実行。旗アイコンのノード（QA・Assembly）がチェックポイントで停止し、承認 / やり直しを選べます。ノードをクリックすると中身が右に出ます。※データはダミーの試作です。</p>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:1rem;">
    <button id="run" style="border-color:var(--border-accent);color:var(--text-accent);"><i class="ti ti-player-play" aria-hidden="true"></i> Run</button>
    <button id="reset"><i class="ti ti-refresh" aria-hidden="true"></i> Reset</button>
    <span style="flex:1;"></span>
    <span style="font-size:13px;color:var(--text-secondary);">Backend</span>
    <button id="backend" style="min-width:96px;"><i class="ti ti-cpu" aria-hidden="true"></i> Local</button>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start;">
    <div id="pipe" style="display:flex;flex-direction:column;gap:6px;"></div>
    <div id="inspector" style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:1rem 1.1rem;min-height:260px;"></div>
  </div>
</div>
<script>
const nodes=[
 {id:1,name:"Planner",sub:"企画・絵コンテ",icon:"ti-bulb",cp:false,out:"storyboard: 4カット\n[夜景賞ねらい] opening/見せ場x2/締め"},
 {id:2,name:"Asset Planner",sub:"素材方針",icon:"ti-list-check",cp:false,out:"cut1-2: 生成 (FLUX)\ncut3: 北九州パレット公式素材\ncut4: 生成"},
 {id:3,name:"Image Gen",sub:"画像生成",icon:"ti-photo",cp:false,out:"4枚生成 (512px)\nbackend: local ComfyUI+FLUX"},
 {id:4,name:"Critic / QA",sub:"品質判定",icon:"ti-checkup-list",cp:true,out:"cut1 OK / cut2 OK\ncut3 NG(構図)→再生成1回→OK\ncut4 OK"},
 {id:5,name:"Video Gen",sub:"画像→動画",icon:"ti-movie",cp:false,out:"4クリップ x 5s\nWan2.1 1.3B (GGUF)"},
 {id:6,name:"Audio",sub:"ナレーション＋BGM",icon:"ti-music",cp:false,out:"narration: VOICEVOX\nBGM: ACE-Step (商用可)"},
 {id:7,name:"Assembly",sub:"結合・字幕",icon:"ti-timeline",cp:true,out:"FFmpeg結合 → 52s\n字幕・BGMミックス済"},
 {id:8,name:"Provenance",sub:"証跡・ログ",icon:"ti-file-description",cp:false,out:"workflow_log.json\nprompts / tool版 / スクショ束"},
];
let state={}, running=false, backend="Local", sel=1;
function init(){nodes.forEach(n=>state[n.id]="pending");running=false;sel=1;render();inspect(1);}
const badge=(s)=>{const m={pending:["待機","var(--text-muted)","var(--surface-1)"],running:["実行中","#854F0B","#FAEEDA"],done:["完了","#0F6E56","#E1F5EE"],paused:["停止中 · 要承認","#185FA5","#E6F1FB"]};const[t,c,b]=m[s];return `<span style="font-size:11px;padding:3px 8px;border-radius:20px;color:${c};background:${b};white-space:nowrap;">${t}</span>`;}
function render(){
 document.getElementById("pipe").innerHTML=nodes.map(n=>{
  const s=state[n.id];const active=sel===n.id;
  return `<div data-id="${n.id}" class="nd" style="cursor:pointer;display:flex;align-items:center;gap:10px;background:var(--surface-2);border:${active?'2px solid var(--border-accent)':'0.5px solid var(--border)'};border-radius:10px;padding:9px 11px;">
   <i class="ti ${n.icon}" style="font-size:18px;color:var(--text-secondary);" aria-hidden="true"></i>
   <div style="flex:1;min-width:0;">
     <div style="font-size:13px;font-weight:500;">${n.id}. ${n.name} ${n.cp?'<i class="ti ti-flag" style="font-size:13px;color:var(--text-accent);" aria-hidden="true"></i>':''}</div>
     <div style="font-size:11px;color:var(--text-muted);">${n.sub}</div>
   </div>
   ${badge(s)}
  </div>`;
 }).join("");
 document.querySelectorAll(".nd").forEach(e=>e.onclick=()=>{sel=+e.dataset.id;render();inspect(sel);});
}
function inspect(id){
 const n=nodes.find(x=>x.id===id);const s=state[id];
 const paused=s==="paused";
 document.getElementById("inspector").innerHTML=`
  <div style="font-size:12px;color:var(--text-muted);margin-bottom:2px;">ノード ${n.id} ${n.cp?'· チェックポイント':''}</div>
  <div style="font-size:16px;font-weight:500;margin-bottom:2px;">${n.name}</div>
  <div style="font-size:13px;color:var(--text-secondary);margin-bottom:10px;">${n.sub}</div>
  <div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">出力プレビュー</div>
  <pre style="font-family:var(--font-mono);font-size:12px;background:var(--surface-1);border-radius:8px;padding:10px;white-space:pre-wrap;color:var(--text-primary);">${s==="pending"?"（未実行）":n.out}</pre>
  ${paused?`<div style="display:flex;gap:8px;margin-top:12px;"><button id="approve" style="border-color:var(--border-accent);color:var(--text-accent);"><i class="ti ti-check" aria-hidden="true"></i> 承認して続行</button><button id="redo"><i class="ti ti-refresh" aria-hidden="true"></i> やり直し</button></div>`:""}
 `;
 if(paused){document.getElementById("approve").onclick=()=>{state[id]="done";advance(id+1);};document.getElementById("redo").onclick=()=>{state[id]="running";inspect(id);setTimeout(()=>{state[id]="paused";sel=id;render();inspect(id);},700);};}
}
function advance(from){
 if(from>nodes.length){running=false;return;}
 const n=nodes.find(x=>x.id===from);
 state[from]="running";sel=from;render();inspect(from);
 setTimeout(()=>{
   if(n.cp){state[from]="paused";render();inspect(from);}
   else{state[from]="done";render();advance(from+1);}
 },850);
}
document.getElementById("run").onclick=()=>{if(running)return;init();running=true;advance(1);};
document.getElementById("reset").onclick=init;
document.getElementById("backend").onclick=function(){backend=backend==="Local"?"Cloud":"Local";this.innerHTML=backend==="Local"?'<i class="ti ti-cpu" aria-hidden="true"></i> Local':'<i class="ti ti-cloud" aria-hidden="true"></i> Cloud';};
init();
</script>
</body>
</html>
