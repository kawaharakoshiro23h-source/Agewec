[project]
name = "agewec-pipeline"
version = "0.1.0"
description = "AGEWEC 2026 agentic video pipeline (LangGraph skeleton)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langchain-openai>=0.1",   # LM Studio(OpenAI互換API)呼び出し用
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",             # ComfyUI/VOICEVOX 等のHTTP呼び出し用
    "python-dotenv>=1",        # .env からAPIキー等を読み込む
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agewec"]

# 使い方（uv 前提）:
#   uv venv && source .venv/bin/activate
#   uv pip install -e .
#   uv run python -m agewec.run --auto
