[project]
name = "agewec-pipeline"
version = "0.1.0"
description = "AGEWEC 2026 agentic video pipeline (LangGraph skeleton)"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2",
    "langgraph-checkpoint-sqlite>=3.0.1", # 中断後も同じrun_idから再開するため
    "langchain-openai>=0.1",   # LM Studio(OpenAI互換API)呼び出し用
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",             # ComfyUI/VOICEVOX/北九州パレット等のHTTP呼び出し用
    "python-dotenv>=1",        # .env からAPIキー等を読み込む
    "beautifulsoup4>=4.12",    # 北九州パレット・ギャラリーのHTML解析
    "lxml>=5",                 # 工程レポートのDOM構造回帰テスト
    "pillow>=10",              # 監視モニタ向け素材サムネイル生成
]

[project.scripts]
agewec = "agewec_v2.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["workflow_v2/agewec_v2"]

# 使い方（uv 前提）:
#   uv venv && source .venv/bin/activate
#   uv pip install -e .
#   uv run python -m agewec_v2.run --auto
